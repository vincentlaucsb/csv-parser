name: Optimized CSV distribution
description: Generate csv.hpp using the released compiler-backed single_header package.
inputs:
  output:
    description: Generated csv.hpp path relative to the repository root.
    required: true
runs:
  using: composite
  steps:
    - uses: vincentlaucsb/single_header@1.1.1
      with:
        backend: clang
        config: single_header.json
        output: ${{ inputs.output }}
        stitching-report: ${{ inputs.output }}.stitching.json
    - name: Write checksum
      shell: bash
      env:
        CSV_GENERATED_OUTPUT: ${{ inputs.output }}
      run: |
        cd "$(dirname "$CSV_GENERATED_OUTPUT")"
        sha256sum "$(basename "$CSV_GENERATED_OUTPUT")" > "$(basename "$CSV_GENERATED_OUTPUT").sha256"
