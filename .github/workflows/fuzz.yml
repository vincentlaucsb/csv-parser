name: CSV fuzzing
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (1 to 900)
        default: '900'
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        target: [stream, differential, boundary]
    steps:
      - uses: actions/checkout@v5
      - name: Configure instrumented parser and harness
        run: >-
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCSV_BUILD_FUZZERS=ON
          -DCSV_BUILD_TESTS=OFF -DCSV_BUILD_PROGRAMS=OFF -DCSV_CXX_STANDARD=20
      - run: cmake --build build/fuzz --target csv_fuzz_${{ matrix.target }} -j2
      - uses: actions/cache/restore@v5
        with:
          path: fuzz-work/corpus
          key: csv-fuzz-v2-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: csv-fuzz-v2-${{ matrix.target }}-
      - name: Replay committed regressions, then fuzz with restored corpus
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
          SECONDS_INPUT: ${{ inputs.seconds }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-work/corpus fuzz-work/artifacts
          cp fuzz/corpus/$TARGET/* fuzz-work/corpus/
          bin=build/fuzz/fuzz/csv_fuzz_$TARGET
          args=(-timeout=90 -rss_limit_mb=2048 -artifact_prefix=fuzz-work/artifacts/)
          for seed in fuzz/corpus/$TARGET/*; do "$bin" "${args[@]}" "$seed"; done 2>&1 | tee fuzz-work/replay.log
          seconds=60
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then seconds=900; fi
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ ! "$SECONDS_INPUT" =~ ^[1-9][0-9]{0,2}$ ]] || (( SECONDS_INPUT > 900 )); then
              echo "seconds must be an integer from 1 through 900" >&2
              exit 2
            fi
            seconds=$SECONDS_INPUT
          fi
          if [[ "$TARGET" == boundary ]]; then
            maxlen=64
            # PRs replay every boundary regression; extended runs mutate recipes.
            if [[ "$EVENT" != schedule && "$EVENT" != workflow_dispatch ]]; then exit 0; fi
          else maxlen=65536; fi
          "$bin" "${args[@]}" -max_len=$maxlen -dict=fuzz/csv.dict -max_total_time=$seconds fuzz-work/corpus 2>&1 | tee fuzz-work/fuzz.log
      - uses: actions/cache/save@v5
        if: success() && github.event_name != 'pull_request'
        with:
          path: fuzz-work/corpus
          key: csv-fuzz-v2-${{ matrix.target }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz-work/
          retention-days: 14
  thread-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build separate ThreadSanitizer replay executables
        run: |
          cmake -S . -B build/tsan -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCSV_BUILD_FUZZERS=ON -DCSV_FUZZ_SANITIZER=thread -DCSV_BUILD_TESTS=OFF -DCSV_BUILD_PROGRAMS=OFF -DCSV_CXX_STANDARD=20
          cmake --build build/tsan --target csv_fuzz_stream csv_fuzz_differential csv_fuzz_boundary -j2
      - name: Deterministic regression replay under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-work
          for target in stream differential boundary; do
            timeout 600 build/tsan/fuzz/csv_fuzz_$target fuzz/corpus/$target/* 2>&1 | tee fuzz-work/tsan-$target.log
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-tsan-${{ github.run_id }}
          path: fuzz-work/
