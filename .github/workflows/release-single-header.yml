name: Release Single Header Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: true

permissions:
  contents: write

jobs:
  publish-single-header:
    name: Generate and upload csv.hpp release asset
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        submodules: recursive

    - name: Create release asset directory
      run: mkdir -p release-assets

    - name: Generate single header
      uses: ./.github/actions/optimized-single-header
      with:
        output: release-assets/csv.hpp

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        gh release upload "$RELEASE_TAG" release-assets/csv.hpp \
          release-assets/csv.hpp.sha256 release-assets/csv.hpp.stitching.json \
          release-assets/csv.hpp.manifest.json --clobber
