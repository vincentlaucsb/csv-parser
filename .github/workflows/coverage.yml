name: Code Coverage

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pull-requests: write

# New PR commits supersede older checks; keep every non-PR run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bound compiler memory use while taking advantage of multiple runner cores.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CSV_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Cache CMake FetchContent dependencies
      uses: actions/cache@v5
      with:
        path: ${{ env.CSV_FETCHCONTENT_BASE_DIR }}
        key: fetchcontent-${{ runner.os }}-coverage-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure CMake with coverage instrumentation
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DENABLE_CODE_COVERAGE=ON
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCSV_CXX_STANDARD=17
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build --config Debug

    - name: Run tests
      working-directory: build
      run: ctest --build-config Debug --output-on-failure

    - name: Capture coverage data
      run: |
        # Exclude non-library sources during capture: GCC can emit inconsistent
        # function ranges in test helpers, before a later --remove can run.
        lcov --capture \
          --directory build \
          --exclude '/usr/*' \
          --exclude '*/external/*' \
          --exclude '*/catch2/*' \
          --exclude '*/Catch2/*' \
          --exclude '*/tests/*' \
          --output-file coverage.info \
          --ignore-errors mismatch,source,empty,unused,negative \
          --rc lcov_branch_coverage=1
        lcov --list coverage.info --ignore-errors empty,unused --rc lcov_branch_coverage=1

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage.info
        flags: cpp
        name: cpp-core
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
        override_pr: ${{ github.event.pull_request.number }}
