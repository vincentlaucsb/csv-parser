name: Compatibility Edge Cases

permissions:
  contents: read

# New PR commits supersede older checks; keep every non-PR run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bound compiler memory use while taking advantage of multiple runner cores.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CSV_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

on:
  push:
    branches: [ "master" ]
    paths:
      - "include/**"
      - "single_header.json"
      - "CMakeLists.txt"
      - ".github/workflows/compat-edge-cases.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "include/**"
      - "single_header.json"
      - "CMakeLists.txt"
      - ".github/workflows/compat-edge-cases.yml"
  workflow_dispatch:

jobs:
  msvc-without-zc-cplusplus:
    name: MSVC without /Zc:__cplusplus
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up MSVC developer command prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install single_header
      id: single-header
      uses: vincentlaucsb/single_header@0.1.0
      with:
        run: "false"

    - name: Configure CMake (for single-header generation)
      run: >
        cmake -S ${{ github.workspace }}
        -B ${{ github.workspace }}/build/no-zc-cplusplus
        -DCSV_CXX_STANDARD=20
        -DCSV_BUILD_PROGRAMS=OFF
        -DCSV_BUILD_TESTS=OFF
        -DBUILD_PYTHON=OFF
        -DCSV_SINGLE_HEADER_EXECUTABLE="${{ steps.single-header.outputs.executable }}"

    - name: Generate amalgamated single-header
      run: cmake --build ${{ github.workspace }}/build/no-zc-cplusplus --config Release --target generate_single_header

    - name: Compile generated single-header without /Zc:__cplusplus
      shell: cmd
      run: |
        REM NOTE: single_include/csv.hpp is an intentional compatibility shim; compile the generated amalgamated header instead.
        echo #include "csv.hpp" > ci_no_zc_single_header.cpp
        echo int main() { return 0; } >> ci_no_zc_single_header.cpp
        cl /nologo /std:c++20 /EHsc /Zc:__cplusplus- /I build\no-zc-cplusplus\single_include_generated /c ci_no_zc_single_header.cpp

    - name: Compile unamalgamated header without /Zc:__cplusplus
      shell: cmd
      run: |
        echo #include "csv.hpp" > ci_no_zc_unamalgamated.cpp
        echo int main() { return 0; } >> ci_no_zc_unamalgamated.cpp
        cl /nologo /std:c++20 /EHsc /Zc:__cplusplus- /I include /c ci_no_zc_unamalgamated.cpp

  mingw-minimal:
    name: MinGW-w64 minimal build and test (C++17)
    runs-on: windows-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Set up MSYS2 (MinGW64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Cache CMake FetchContent dependencies
      uses: actions/cache@v5
      with:
        path: ${{ env.CSV_FETCHCONTENT_BASE_DIR }}
        key: fetchcontent-${{ runner.os }}-mingw-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

    - name: Configure CMake (MinGW, C++17)
      shell: msys2 {0}
      run: >
        cmake -S . -B build/mingw-minimal -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCSV_CXX_STANDARD=17
        -DCSV_BUILD_PROGRAMS=OFF
        -DBUILD_PYTHON=OFF

    - name: Build
      shell: msys2 {0}
      run: cmake --build build/mingw-minimal

    - name: Test
      shell: msys2 {0}
      run: ctest --test-dir build/mingw-minimal --output-on-failure

  mingw-winlibs-repro:
    name: WinLibs GCC 16.1.0 MinGW repro
    runs-on: windows-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install WinLibs GCC 16.1.0
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "winlibs-gcc-16.1.0.zip"
        $destination = Join-Path $env:RUNNER_TEMP "winlibs-gcc-16.1.0"
        Invoke-WebRequest `
          -Uri "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r3.zip" `
          -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $destination
        $bin = Split-Path (Get-ChildItem -LiteralPath $destination -Filter g++.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName)
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "WINLIBS_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure CMake without float fallback
      shell: pwsh
      run: >
        cmake -S . -B build/mingw-winlibs-repro -G "MinGW Makefiles"
        -DCMAKE_BUILD_TYPE=Release
        -DCSV_CXX_STANDARD=17
        -DCSV_BUILD_PROGRAMS=OFF
        -DBUILD_PYTHON=OFF
        -DCMAKE_C_COMPILER="$env:WINLIBS_BIN\gcc.exe"
        -DCMAKE_CXX_COMPILER="$env:WINLIBS_BIN\g++.exe"
        -DCMAKE_MAKE_PROGRAM="$env:WINLIBS_BIN\mingw32-make.exe"

    - name: Build
      shell: pwsh
      run: cmake --build build/mingw-winlibs-repro
